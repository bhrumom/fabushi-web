# Canonical host routing config. Never deploy with an incomplete site export.
name = "fabushi-official-site"
main = "official-site-worker.js"
compatibility_date = "2026-05-06"
routes = [
  { pattern = "ombhrum.com/*", zone_name = "ombhrum.com" },
  { pattern = "fabushi.ombhrum.com", custom_domain = true },
  { pattern = "web.ombhrum.com", custom_domain = true }
]

[assets]
directory = "apps/web/out"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "404-page"

[[r2_buckets]]
binding = "OFFICIAL_SITE_R2"
bucket_name = "bushi"
